# Composição de produção da POC — Mundial · Conferência de Recebimento.
#
# Escrito na máquina pelo cloud-init. Valores vêm de /opt/mundial/.env.
# Espelha o docker-compose.yml da raiz do repositório, com três diferenças:
# usa imagens publicadas em vez de build, não expõe porta de banco nem de API,
# e põe um proxy reverso na frente para servir tudo na mesma origem.
#
#   docker compose up -d                 sobe apenas o banco
#   docker compose --profile app up -d   sobe migrações, api, web e proxy

name: mundial

services:

  # Aqui é SQL Server 2022 de verdade, o alvo do spine. O azure-sql-edge do
  # .env.example existe só para desenvolvimento em Apple Silicon: a imagem do
  # SQL Server é publicada apenas para linux/amd64. Nesta CVM x86 não é preciso.
  db:
    image: ${IMAGEM_SQLSERVER}
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
      MSSQL_PID: Developer
      TZ: ${TZ_APLICACAO}
    volumes:
      - dados-sgm:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q 'SELECT 1' >/dev/null 2>&1
          || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q 'SELECT 1' >/dev/null 2>&1
          || bash -c 'echo > /dev/tcp/127.0.0.1/1433'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    restart: unless-stopped
    # sem ports: 1433 só existe dentro da rede do compose

  # Roda uma vez, aplica os scripts DbUp e sai. Idempotente. Seed nunca aqui (AD-21).
  migracoes:
    image: ${IMAGEM_MIGRACOES}
    profiles: ["app"]
    environment:
      CONNECTION_STRING: ${CONNECTION_STRING}
      # Um span por script DbUp. Serviço à parte no SigNoz: este container vive segundos e some.
      OTEL_SERVICE_NAME: mundial-migracoes
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: ${IMAGEM_API}
    profiles: ["app"]
    environment:
      CONNECTION_STRING: ${CONNECTION_STRING}
      MODO_DEMO: ${MODO_DEMO}
      ORIGEM_WEB: ${ORIGEM_WEB}
      DOCS_ABERTOS: ${DOCS_ABERTOS}
      TZ_APLICACAO: ${TZ_APLICACAO}
      INTEGRACAO_ESTOQUE_EXTERNO: ${INTEGRACAO_ESTOQUE_EXTERNO}
      # A API aborta na subida sem JWT_SEGREDO (Program.cs). Faltava aqui: o
      # compose da raiz passa as duas, este não passava nenhuma, e a máquina
      # ficou servindo uma imagem anterior ao guard até o pinning ser corrigido.
      JWT_SEGREDO: ${JWT_SEGREDO}
      SESSAO_MINUTOS: ${SESSAO_MINUTOS}
      # Lidas pelo SDK do OpenTelemetry. Endpoint vazio desliga a instrumentação.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES}
      # Exemplar amarra o ponto do histograma ao trace que o produziu. O valor embutido aqui é
      # de propósito: chave que falte no .env da máquina não desliga o recurso — que é
      # exatamente o modo de falha que deixou a telemetria desligada em produção.
      OTEL_METRICS_EXEMPLAR_FILTER: ${OTEL_METRICS_EXEMPLAR_FILTER:-trace_based}
      # O SigNoz armazena contador em delta; em cumulativo todo restart zera a série.
      OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: ${OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE:-delta}
    depends_on:
      db:
        condition: service_healthy
      migracoes:
        condition: service_completed_successfully
    healthcheck:
      # A imagem aspnet não traz curl; o teste de porta basta para o depends_on.
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/5000'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    # sem ports: quem fala com a API é o proxy

  web:
    image: ${IMAGEM_WEB}
    profiles: ["app"]
    environment:
      # Injetada no index.html na subida do container. É a origem pública, e o
      # frontend acrescenta /api — que o proxy roteia para a API.
      API_URL: ${URL_PUBLICA}
      # /otlp cai no handle padrão do Caddy e chega aqui; é o nginx deste container
      # que põe o Authorization do coletor, para o token não viver no JavaScript.
      OTEL_WEB: ${OTEL_WEB}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Serve tudo na mesma origem: / vai para o web:3000, /api vai para a api:5000.
  # Resolve o CORS e evita o erro clássico de apontar o navegador para um nome
  # de serviço do compose, que só resolve dentro da máquina.
  proxy:
    image: caddy:2-alpine
    profiles: ["app"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./publico:/srv/publico:ro
      - caddy-dados:/data
      - caddy-config:/config
    depends_on:
      - web
      - api
    restart: unless-stopped

volumes:
  dados-sgm:
  caddy-dados:
  caddy-config:
