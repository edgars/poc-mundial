server {
  listen 3000;
  root /usr/share/nginx/html;
  index index.html;

  # Telemetria do navegador. O arquivo é escrito pelo entrypoint na subida: com
  # OTEL_WEB=false ele sai vazio, e /otlp deixa de existir. O bloco vive fora daqui
  # porque carrega o token do coletor, que não pode ser versionado.
  include /etc/nginx/otlp.conf;

  # SPA: qualquer rota cai no index
  location / { try_files $uri $uri/ /index.html; }
}
