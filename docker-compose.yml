services:
  # O alvo declarado no spine é SQL Server 2022. Em Apple Silicon a imagem oficial só existe
  # para amd64 e quebra sob emulação ("Invalid mapping of address"), então DB_IMAGE aponta para
  # o Azure SQL Edge, que é o mesmo motor com imagem ARM64 nativa. Trocar de volta é mudar o .env.
  db:
    image: ${DB_IMAGE}
    user: ${DB_USER}
    environment:
      ACCEPT_EULA: "1"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
    ports: ["1433:1433"]
    volumes:
      - dados-sgm:/var/opt/mssql          # NFR-12: o dado sobrevive a down + up

  migracoes:
    build:
      context: ./src
      target: migracoes
    environment:
      CONNECTION_STRING: ${CONNECTION_STRING}
    depends_on: [db]
    restart: "no"

  api:
    build:
      context: ./src
      target: api
    environment:
      CONNECTION_STRING: ${CONNECTION_STRING}
      MODO_DEMO: ${MODO_DEMO}
      ORIGEM_WEB: ${ORIGEM_WEB}
      JWT_SEGREDO: ${JWT_SEGREDO}
      SESSAO_MINUTOS: ${SESSAO_MINUTOS}
      DOCS_ABERTOS: ${DOCS_ABERTOS}
      TZ_APLICACAO: ${TZ_APLICACAO}
      INTEGRACAO_ESTOQUE_EXTERNO: ${INTEGRACAO_ESTOQUE_EXTERNO}
      # Lidas pelo SDK do OpenTelemetry. Endpoint vazio desliga a instrumentação.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES}
    ports: ["${PORTA_API}:5000"]
    depends_on:
      migracoes:
        condition: service_completed_successfully

  web:
    build:
      context: ./web
      target: web
    environment:
      API_URL: ${API_URL}
      TZ_APLICACAO: ${TZ_APLICACAO}
      # O nginx do container repassa /otlp para o coletor pondo o Authorization —
      # o token nunca chega ao navegador. OTEL_WEB=false desliga a telemetria do front.
      OTEL_WEB: ${OTEL_WEB}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS}
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  dados-sgm:
