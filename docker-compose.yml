services:
  # O alvo declarado no spine é SQL Server 2022. Em Apple Silicon a imagem oficial só existe
  # para amd64 e quebra sob emulação ("Invalid mapping of address"), então DB_IMAGE aponta para
  # o Azure SQL Edge, que é o mesmo motor com imagem ARM64 nativa. Trocar de volta é mudar o .env.
  db:
    image: ${DB_IMAGE}
    user: ${DB_USER}
    environment:
      ACCEPT_EULA: "1"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
    ports: ["1433:1433"]
    volumes:
      - dados-sgm:/var/opt/mssql          # NFR-12: o dado sobrevive a down + up

  migracoes:
    build:
      context: ./src
      target: migracoes
      args:
        VERSAO: ${VERSAO:-dev}
    environment:
      CONNECTION_STRING: ${CONNECTION_STRING}
      # Um span por script DbUp. Serviço à parte no SigNoz de propósito: este container vive
      # segundos e some, e misturá-lo com a api distorceria toda métrica de disponibilidade.
      OTEL_SERVICE_NAME: mundial-migracoes
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES}
    depends_on: [db]
    restart: "no"

  api:
    build:
      context: ./src
      target: api
      args:
        VERSAO: ${VERSAO:-dev}
    environment:
      CONNECTION_STRING: ${CONNECTION_STRING}
      MODO_DEMO: ${MODO_DEMO}
      ORIGEM_WEB: ${ORIGEM_WEB}
      JWT_SEGREDO: ${JWT_SEGREDO}
      SESSAO_MINUTOS: ${SESSAO_MINUTOS}
      DOCS_ABERTOS: ${DOCS_ABERTOS}
      TZ_APLICACAO: ${TZ_APLICACAO}
      INTEGRACAO_ESTOQUE_EXTERNO: ${INTEGRACAO_ESTOQUE_EXTERNO}
      # Lidas pelo SDK do OpenTelemetry. Endpoint vazio desliga a instrumentação.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES}
      # Exemplar amarra o ponto do histograma ao trace que o produziu: no SigNoz dá para clicar
      # no pico de latência e cair no request lento. É configuração do SDK, não código.
      # Com valor embutido aqui: chave que falte no .env da máquina não desliga o recurso.
      OTEL_METRICS_EXEMPLAR_FILTER: ${OTEL_METRICS_EXEMPLAR_FILTER:-trace_based}
      # O SigNoz armazena contador em delta. Em cumulativo, todo restart do container zera a
      # série e o painel mostra queda onde não houve nenhuma.
      OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: ${OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE:-delta}
    ports: ["${PORTA_API}:5000"]
    depends_on:
      migracoes:
        condition: service_completed_successfully

  web:
    build:
      context: ./web
      target: web
      args:
        VERSAO: ${VERSAO:-dev}
    environment:
      API_URL: ${API_URL}
      TZ_APLICACAO: ${TZ_APLICACAO}
      # O nginx do container repassa /otlp para o coletor pondo o Authorization —
      # o token nunca chega ao navegador. OTEL_WEB=false desliga a telemetria do front.
      OTEL_WEB: ${OTEL_WEB}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS}
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  dados-sgm:
